# Render Blueprint: one-click production deploy.
# Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: askai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: askai-db
          property: connectionString
      - key: AI_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: askai-db
    plan: free
    databaseName: askai
    user: askai
