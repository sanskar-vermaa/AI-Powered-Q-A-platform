# Full stack: the web app plus an Oracle Database Free instance.
#   docker compose up --build
# Then open http://localhost:8000
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-oracle_admin}
      APP_USER: ${ORACLE_APP_USER:-qa}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-qa_password}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DATABASE_URL: oracle+oracledb://${ORACLE_APP_USER:-qa}:${ORACLE_APP_PASSWORD:-qa_password}@oracle:1521/?service_name=FREEPDB1
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  oracle-data:
